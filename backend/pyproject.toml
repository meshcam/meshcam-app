[project]
name = "trailcam"
version = "0.1.0"
description = "MeshCam backend — ingest, gallery, retention"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.41",
    "asyncpg>=0.31",
    "alembic>=1.16",
    "pydantic>=2.12",
    "pydantic-settings>=2.10",
    "authlib>=1.6",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.20",
    "aioboto3>=15",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "aiosqlite>=0.21",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trailcam"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom uses calls in defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form"]
